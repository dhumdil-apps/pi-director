        --tuto-bg: #0e1015;
        --tuto-grid: color-mix(in srgb, #ffffff 3%, transparent);
        --tuto-text: #ffffff;
        --tuto-text-muted: #9ba3b5;
        --tuto-muted: #647087;
        --tuto-panel-bg: #14171f;
        --tuto-panel-head: #1c202b;

        --tuto-border-subtle: #1e2330;
        --tuto-edge: #5b6477;

        --tuto-tool-bg: #14171f;
        --tuto-badge-bg: #252b3a;
        --tuto-highlight: rgba(59, 130, 246, 0.2);
        --tuto-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);

        --tuto-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        --flow-bg: var(--tuto-bg);
        --flow-grid: var(--tuto-grid);
        --flow-text: var(--tuto-text);
        --flow-text-muted: var(--tuto-text-muted);
        --flow-muted: var(--tuto-muted);
        --flow-panel-bg: var(--tuto-panel-bg);
        --flow-panel-head: var(--tuto-panel-head);
        --flow-card-bg: var(--tuto-card-bg);
        --flow-card-selected-bg: var(--tuto-card-selected-bg);
        --flow-head-bg: var(--tuto-head-bg);
        --flow-head-selected-bg: var(--tuto-head-selected-bg);
        --flow-border: var(--tuto-border);
        --flow-border-subtle: var(--tuto-border-subtle);
        --flow-edge: var(--tuto-edge);
        --flow-edge-dim: var(--tuto-edge-dim);
        --flow-hot: var(--tuto-hot);
        --flow-tool-bg: var(--tuto-tool-bg);
        --flow-badge-bg: var(--tuto-badge-bg);
        --flow-highlight: var(--tuto-highlight);
        --flow-shadow: var(--tuto-shadow);
        --font-sans: var(--tuto-font-sans);
        --font-mono: var(--tuto-font-mono);
      }

      [data-theme="light"],
      :root[data-theme="light"] {
        color-scheme: light;
        --tuto-bg: #f8fafc;
        --tuto-grid: color-mix(in srgb, #64748b 10%, transparent);
        --tuto-text: #0f172a;
        --tuto-text-muted: #475569;
        --tuto-muted: #64748b;
        --tuto-panel-bg: #ffffff;
        --tuto-panel-head: #f1f5f9;
        --tuto-card-bg: #ffffff;
        --tuto-card-selected-bg: #f8fafc;
        --tuto-head-bg: #f1f5f9;
        --tuto-head-selected-bg: #e2e8f0;
        --tuto-border: #cbd5e1;
        --tuto-border-subtle: #e2e8f0;
        --tuto-edge: #64748b;
        --tuto-edge-dim: #e2e8f0;
        --tuto-hot: #2563eb;
        --tuto-tool-bg: #ffffff;
        --tuto-badge-bg: #f1f5f9;
        --tuto-highlight: rgba(37, 99, 235, 0.12);
        --tuto-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--tuto-bg, #0c0e12);
        color: var(--tuto-text, #e8eaed);
        font-family: var(--tuto-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* ---------------- Header Navbar ---------------- */
      header#topbar {
        position: relative;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        height: 3.2rem;
        padding: 0 1rem;
        background: #090b12;
        border-bottom: 1px solid #161b2b;
        flex-shrink: 0;
      }
      [data-theme="light"] header#topbar {
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-shrink: 0;
      }

      .brand-logo {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #f97316;
        color: #ffffff;
        font-family: serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(249, 115, 22, 0.35);
      }

      .brand-name {
        font-weight: 700;
        font-size: 14.5px;
        letter-spacing: -0.01em;
        color: var(--tuto-text, #f1f5f9);
      }

      .brand-badge-tag {
        font-family: var(--tuto-font-mono, monospace);
        font-size: 10.5px;
        padding: 2px 6px;
        border: 1px solid #1e2438;
        background: #0d0f17;
        border-radius: 4px;
        color: var(--tuto-text-muted, #94a3b8);
      }
      [data-theme="light"] .brand-badge-tag {
        border-color: #cbd5e1;
        background: #f1f5f9;
        color: #64748b;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        justify-content: flex-end;
        max-width: 640px;
      }

      .install-bar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 3px 4px 3px 10px;
        background: #08090f;
        border: 1px solid #1a1e2e;
        border-radius: 6px;
        width: 100%;
        max-width: 530px;
      }
      [data-theme="light"] .install-bar {
        background: #f8fafc;
        border-color: #cbd5e1;
      }

      .install-bar .prompt {
        color: #475569;
        font-family: var(--tuto-font-mono, monospace);
        font-size: 12px;
        user-select: none;
      }

      .install-bar .cmd-text {
        font-family: var(--tuto-font-mono, monospace);
        font-size: 11.5px;
        color: #38bdf8;
        background: transparent;
        padding: 0;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      [data-theme="light"] .install-bar .cmd-text {
        color: #0284c7;
      }

      .btn-copy {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.55rem;
        height: 1.55rem;
        border-radius: 4px;
        border: 1px solid #273147;
        background: #111624;
        color: #94a3b8;
        cursor: pointer;
        transition: all 120ms ease;
        flex-shrink: 0;
        padding: 0;
      }
      .btn-copy .icon-check {
        display: none;
      }
      .btn-copy:hover {
        background: #1a2236;
        border-color: #38bdf8;
        color: #f1f5f9;
      }
      .btn-copy.copied {
        background: #064e3b;
        border-color: #10b981;
        color: #34d399;
      }
      .btn-copy.copied .icon-copy {
        display: none;
      }
      .btn-copy.copied .icon-check {
        display: block;
      }
      [data-theme="light"] .btn-copy {
        border-color: #cbd5e1;
        background: #f1f5f9;
        color: #64748b;
      }
      [data-theme="light"] .btn-copy:hover {
        background: #e2e8f0;
        border-color: #0284c7;
        color: #0f172a;
      }
      [data-theme="light"] .btn-copy.copied {
        background: #d1fae5;
        border-color: #10b981;
        color: #065f46;
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 0.4rem;
        border: 1px solid var(--tuto-border, #30363d);
        background: var(--tuto-panel-head, #1c2128);
        color: var(--tuto-text-muted, #94a3b8);
        cursor: pointer;
        transition: all 120ms ease;
        flex-shrink: 0;
      }

      .btn-icon:hover {
        border-color: var(--tuto-hot, #3b82f6);
        color: var(--tuto-text, #e8eaed);
      }

      /* ---------------- Stage ---------------- */
      main#stage {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      tuto-flow-canvas {
        width: 100%;
        height: 100%;
      }

      /* ---------------- Footer ---------------- */
      footer#bottombar {
        width: 100%;
        height: 38px;
        background: #06070b;
        border-top: 1px solid #161b2b;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        gap: 1rem;
        flex-shrink: 0;
        user-select: none;
        z-index: 25;
        font-size: 11px;
      }
      [data-theme="light"] footer#bottombar {
        background: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }

      .footer-left {
        display: flex;
        align-items: center;
      }

      .gh-version-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 7px;
        background: #0a0d16;
        border: 1px solid #161d2e;
        border-radius: 5px;
        color: #94a3b8;
        font-size: 11px;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .gh-version-badge:hover {
        color: #f1f5f9;
        background: #111728;
        border-color: #2b3956;
      }
      [data-theme="light"] .gh-version-badge {
        background: #ffffff;
        border-color: #cbd5e1;
        color: #475569;
      }
      [data-theme="light"] .gh-version-badge:hover {
        color: #0f172a;
        background: #f1f5f9;
        border-color: #94a3b8;
      }

      .version-tag {
        font-family: var(--tuto-font-mono, monospace);
        font-size: 10px;
        padding: 1px 5px;
        background: #151b29;
        border: 1px solid #1e263c;
        border-radius: 3px;
        color: #38bdf8;
        line-height: 1.2;
      }
      [data-theme="light"] .version-tag {
        background: #e0f2fe;
        border-color: #bae6fd;
        color: #0284c7;
      }

      .footer-center {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--tuto-muted, #64748b);
        font-size: 11px;
      }
      .kbd-hint {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .kbd-hint kbd {
        display: inline-block;
        padding: 0.05rem 0.35rem;
        font-family: var(--tuto-font-mono, monospace);
        font-size: 9.5px;
        background: var(--tuto-panel-head, #1c2128);
        border: 1px solid var(--tuto-border, #30363d);
        border-radius: 3px;
        color: var(--tuto-text-muted, #94a3b8);
      }

      .footer-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--tuto-muted, #64748b);
        font-size: 11px;
        font-family: var(--tuto-font-mono, monospace);
      }

      @media (max-width: 768px) {
        .footer-center {
          display: none;
        }
        .install-bar {
          max-width: 280px;
        }
      }
    </style>

    <!-- Flow Diagram Initialization (file:// safe, standard script) -->
    <script>
      const fsmData = JSON.parse(document.getElementById("workflow-fsm-data").textContent);
      const canvas = document.getElementById("flow-canvas");

      // 7-"E" Lifecycle Step Node Layout (Spacious 240px-Gap 2-Row Circuit)
      // Primary (top) / secondary (bottom) columns: entry | align | spec | vibe
      const NODE_LAYOUT = {
        envision: { x: 80, y: 280, w: 220, h: 44 },
        evaluate: { x: 420, y: 120, w: 220, h: 44 },
        establish: { x: 420, y: 440, w: 220, h: 44 },
        explore: { x: 860, y: 120, w: 220, h: 44 },
        elaborate: { x: 860, y: 440, w: 220, h: 44 },
        execute: { x: 1300, y: 120, w: 220, h: 44 },
        examine: { x: 1300, y: 440, w: 220, h: 44 },
      };

      const states = {};
      for (const [id, pos] of Object.entries(NODE_LAYOUT)) {
        const raw = (fsmData.states && fsmData.states[id]) || {};
        states[id] = {
          ...raw,
          ...pos,
          id,
        };
      }

      canvas.graph = {
        ...fsmData,
        framing: false,
        title: "Pi Director Agent Workflow",
        subtitle: "Primary homes + secondary gates (v2.4)",
        groups: [],
        states,
      };

      // Set footer version badge
      const footerVersion = document.getElementById("footer-version");
      if (footerVersion && fsmData.version) {
        footerVersion.textContent = `v${fsmData.version}`;
      }

      // Copy install command button
      const btnCopy = document.getElementById("btn-copy-cmd");
      const cmdText =
        document.getElementById("cmd-install")?.textContent || "pi install https://github.com/dhumdil-apps/pi-director";
      if (btnCopy) {
        btnCopy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(cmdText);
            btnCopy.classList.add("copied");
            setTimeout(() => {
              btnCopy.classList.remove("copied");
            }, 1600);
          } catch {}
        });
      }

      // Theme toggle
      const btnTheme = document.getElementById("btn-theme");
      try {
        const savedTheme = localStorage.getItem("pi_workflow_theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
          canvas.theme = savedTheme;
        }
      } catch {}

      btnTheme.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "dark";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        canvas.theme = next;
        try {
          localStorage.setItem("pi_workflow_theme", next);
        } catch {}
      });
    </script>
