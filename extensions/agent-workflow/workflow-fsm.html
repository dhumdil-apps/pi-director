<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Director Workflow FSM</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0c0e12;
        --grid: color-mix(in srgb, #94a3b8 8%, transparent);
        --text: #e8eaed;
        --muted: #94a3b8;
        --panel: #161b22;
        --panel-border: #30363d;
        --panel-head: #1c2128;
        --card: #12161c;
        --card-border: #30363d;
        --card-head: #1a2030;
        --child: #0f1419;
        --child-border: #3d4450;
        --current: #3b82f6;
        --current-glow: color-mix(in srgb, #3b82f6 28%, transparent);
        --edge: #4b5563;
        --edge-hot: #93c5fd;
        --proc: #1a1f2e;
        --tool: #141a24;
        --toolbar: #161b22;
        --toolbar-border: #30363d;
        --code: #cbd5e1;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e8ecf1;
          --grid: color-mix(in srgb, #64748b 12%, transparent);
          --text: #0f172a;
          --muted: #64748b;
          --panel: #ffffff;
          --panel-border: #cbd5e1;
          --panel-head: #f1f5f9;
          --card: #ffffff;
          --card-border: #cbd5e1;
          --card-head: #eef2ff;
          --child: #f8fafc;
          --child-border: #cbd5e1;
          --current: #2563eb;
          --current-glow: color-mix(in srgb, #2563eb 20%, transparent);
          --edge: #94a3b8;
          --edge-hot: #1d4ed8;
          --proc: #f8fafc;
          --tool: #f1f5f9;
          --toolbar: #ffffff;
          --toolbar-border: #cbd5e1;
          --code: #334155;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: row;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      #chart {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #chart.is-panning {
        cursor: grabbing;
      }
      .toolbar {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.28rem;
        background: var(--toolbar);
        border: 1px solid var(--toolbar-border);
        border-radius: 10px;
        box-shadow: 0 8px 24px color-mix(in srgb, #000 35%, transparent);
        z-index: 3;
      }
      .toolbar button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid var(--toolbar-border);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        transition: all 120ms ease;
      }
      .toolbar button:hover,
      .toolbar button:focus-visible,
      .toolbar button.is-on {
        border-color: var(--current);
        outline: none;
      }
      .toolbar button.is-on {
        background: color-mix(in srgb, var(--current) 18%, transparent);
        color: var(--current);
      }
      .toolbar button svg {
        display: block;
      }
      .toolbar-sep {
        width: 1px;
        height: 1.2rem;
        background: var(--toolbar-border);
        margin: 0 0.15rem;
      }
      .warn {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        padding: 2rem;
        text-align: center;
      }
      #hint {
        flex: 0 0 0;
        width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid transparent;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition:
          flex-basis 160ms ease,
          width 160ms ease,
          opacity 120ms ease,
          border-color 120ms ease;
        z-index: 4;
      }
      #hint.is-open {
        flex: 0 0 min(400px, 38vw);
        width: min(400px, 38vw);
        border-left-color: var(--panel-border);
        opacity: 1;
        pointer-events: auto;
      }
      #hint header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem 0.85rem;
        background: var(--panel-head);
        border-bottom: 1px solid var(--panel-border);
      }
      #hint header h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }
      #hint header p {
        margin: 0.2rem 0 0;
        color: var(--muted);
        font-size: 0.75rem;
      }
      #hint .body {
        padding: 0.75rem 0.85rem 1rem;
        overflow: auto;
        font-size: 0.8rem;
        line-height: 1.45;
      }
      #hint .body h3 {
        margin: 0.85rem 0 0.35rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      #hint .body h3:first-child {
        margin-top: 0;
      }
      #hint .body ul {
        margin: 0;
        padding-left: 1.1rem;
      }
      #hint .body li {
        margin: 0.28rem 0;
        color: var(--code);
      }
      #hint .body .summary {
        margin: 0;
        color: var(--text);
      }
      #hint .body .kv {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      #hint .body .chip {
        display: inline-flex;
        padding: 0.12rem 0.45rem;
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        color: var(--muted);
        font-size: 0.7rem;
      }
      #hint .close {
        border: 1px solid var(--panel-border);
        background: transparent;
        color: var(--text);
        border-radius: 7px;
        width: 1.7rem;
        height: 1.7rem;
        cursor: pointer;
      }
      #hint .close:hover,
      #hint .close:focus-visible {
        border-color: var(--current);
        outline: none;
      }

      .edge-pill text {
        pointer-events: none;
      }
      .state-node {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="chart" role="img" aria-label="Workflow FSM flat XState-style diagram"></svg>

        <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"

            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button type="button" id="fit" title="Fit chart" aria-label="Fit chart">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
        <button type="button" id="reset" title="Reset view" aria-label="Reset view">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button type="button" id="sidebar" title="Toggle instruction sidebar" aria-label="Toggle instruction sidebar">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M15 3v18" />
          </svg>
        </button>
      </div>
    </div>
    <aside id="hint" aria-live="polite" aria-label="Instruction sidebar"></aside>

    <script type="module">
      const NS = "http://www.w3.org/2000/svg";
      const fsm = JSON.parse(document.getElementById("workflow-fsm-data").textContent);
      const svg = document.getElementById("chart");
      const hint = document.getElementById("hint");
      const states = fsm.states || {};
      const procedures = fsm.procedures || {};
      const tools = Array.isArray(fsm.tools) ? fsm.tools : [];
      const transitions = Array.isArray(fsm.transitions) ? fsm.transitions : [];

      let selected = fsm.initial || "editor";
      let sidebarOn = false;
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let viewport = null;
      let pinnedHint = null;

      if (!states[selected]) {
        document
          .getElementById("stage")
          .insertAdjacentHTML(
            "beforeend",
            '<p class="warn">Embedded snapshot may be stale. Run <code>npm run build:content</code>.</p>',
          );
      }

      const MODE_TOOLS = {
        align: ["ask", "start", "next"],
        spec: ["start", "decide", "next"],
        vibe: ["start", "decide", "next"],
      };

      const NODE_W = 148;
      const NODE_H = 52;
      // Hand-tuned flat ranks with breathing room: editor | modes | procedures | handoff
      const NODE_POS = {
        editor: { x: 160, y: 460 },
        align: { x: 780, y: 120 },
        spec: { x: 780, y: 460 },
        vibe: { x: 780, y: 800 },
        closeOut: { x: 1400, y: 260 },
        blocked: { x: 1400, y: 660 },
        handoff: { x: 1980, y: 460 },
      };

      function svgEl(name, attrs = {}, parent) {
        const node = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          if (value != null) node.setAttribute(key, String(value));
        }
        parent?.appendChild(node);
        return node;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function procedureRefName(line) {
        const match =
          line.match(/\bprocedures\.([A-Z][A-Z0-9_]*)\b/) ||
          line.match(/\bFollow procedures\.([A-Z][A-Z0-9_]*)\b/i) ||
          line.match(/\bRUN ([A-Z][A-Z0-9_]*)\b/);
        if (!match) return null;
        return procedures[match[1]] ? match[1] : null;
      }

      function effectiveProcedureLines(state) {
        const lines = [];
        const seen = new Set();
        for (const step of state.procedure || []) {
          lines.push(step);
          const ref = procedureRefName(step);
          if (ref && !seen.has(ref)) {
            seen.add(ref);
            for (const body of procedures[ref] || []) lines.push(`${ref}: ${body}`);
          }
        }
        for (const [name, steps] of Object.entries(procedures)) {
          const mentioned = (state.procedure || []).some((step) => step.includes(name));
          if (!mentioned || seen.has(name)) continue;
          if (
            state.kind === "procedure" ||
            (state.procedure || []).some((s) => s.includes(`RUN ${name}`) || s.includes(`procedures.${name}`))
          ) {
            seen.add(name);
            for (const body of steps) lines.push(`${name}: ${body}`);
          }
        }
        return lines;
      }

      function toolByName(name) {
        return tools.find((t) => t.name === name);
      }

      function isCmdEvent(event) {
        return /^CMD_/.test(event);
      }

      function isEscEvent(event) {
        return event === "PICKER_DISMISS" || event === "NO_WORK";
      }

      /** Q5/D3: collapse CMD_* (incl. self) and non-self ESC families per from→to. */
      function collapseEdges() {
        const groups = new Map();
        for (const t of transitions) {
          let key;
          let family = null;
          if (isCmdEvent(t.event)) {
            key = `${t.from}\0${t.to}\0CMD`;
            family = "CMD";
          } else if (t.from !== t.to && isEscEvent(t.event)) {
            key = `${t.from}\0${t.to}\0ESC`;
            family = "ESC";
          } else {
            key = `${t.from}\0${t.to}\0${t.event}`;
          }
          if (!groups.has(key)) {
            groups.set(key, {
              id: key,
              from: t.from,
              to: t.to,
              family,
              members: [],
            });
          }
          groups.get(key).members.push(t);
        }

        const items = [];
        for (const g of groups.values()) {
          const n = g.members.length;
          const first = g.members[0];
          const self = g.from === g.to;
          let event;
          let label = null;
          if (g.family === "CMD") {
            event = n > 1 ? `CMD_* ×${n}` : first.event;
          } else if (g.family === "ESC") {
            event = n > 1 ? `ESC ×${n}` : first.event;
          } else {
            event = first.event;
            if (first.label && first.label !== first.event) label = first.label;
          }
          items.push({
            id: g.id,
            from: g.from,
            to: g.to,
            self,
            family: g.family,
            bundle: n > 1,
            event,
            label,
            members: g.members,
            description: n === 1 ? first.description || "" : g.members.map((m) => m.event).join(", "),
            userMediated: g.members.some((m) => m.userMediated),
          });
        }
        return items;
      }

      function layoutFlatXState() {
        const nodes = {};
        for (const [id, pos] of Object.entries(NODE_POS)) {
          const state = states[id];
          if (!state) continue;
          nodes[id] = {
            id,
            x: pos.x,
            y: pos.y,
            w: NODE_W,
            h: NODE_H,
            label: state.label || id,
            kind: state.kind || "mode",
            permission: state.permission || "",
          };
        }
        const pad = 110;
        const head = 48;
        let minX = Infinity;
        let minY = Infinity;
        let maxR = 0;
        let maxB = 0;
        for (const n of Object.values(nodes)) {
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxR = Math.max(maxR, n.x + n.w);
          maxB = Math.max(maxB, n.y + n.h);
        }
        const extraLeft = 140;
        const extraBottom = 180;
        const frame = {
          x: minX - pad - extraLeft,
          y: minY - pad - head,
          w: maxR - minX + pad * 2 + extraLeft,
          h: maxB - minY + pad * 2 + head + extraBottom,
          head,
        };
        return { nodes, frame };
      }

      function nodeCenter(n) {
        return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
      }

      function port(n, side, t = 0.5) {
        const y = n.y + n.h * Math.min(0.9, Math.max(0.1, t));
        const x = n.x + n.w * Math.min(0.9, Math.max(0.1, t));
        if (side === "left") return { x: n.x, y };
        if (side === "right") return { x: n.x + n.w, y };
        if (side === "top") return { x, y: n.y };
        return { x, y: n.y + n.h };
      }

      /** Lanes fan per source so multi-target exits get distinct horizontal seats. */
      function assignLanes(items, nodes) {
        const buckets = new Map();
        for (const item of items) {
          const a = nodes[item.from];
          const b = nodes[item.to];
          let bucket;
          if (item.self) bucket = `self:${item.from}`;
          else if (b && a && b.x > a.x) bucket = `fwd:${item.from}`;
          else if (item.to === "editor" && item.from !== "editor") bucket = `back:${item.from}`;
          else if (a && b && Math.abs(a.x - b.x) < 4) bucket = `col:${item.from}`;
          else bucket = `other:${item.from}`;
          if (!buckets.has(bucket)) buckets.set(bucket, []);
          buckets.get(bucket).push(item);
        }
        for (const list of buckets.values()) {
          list.sort((a, b) => {
            const ay = nodes[a.to]?.y ?? 0;
            const by = nodes[b.to]?.y ?? 0;
            if (ay !== by) return ay - by;
            return a.event.localeCompare(b.event);
          });
          list.forEach((item, i) => {
            item.lane = i;
            item.laneCount = list.length;
          });
        }
        return items;
      }

      function routeItem(item, nodes) {
        const a = nodes[item.from];
        const b = nodes[item.to];
        if (!a || !b) return null;
        const lane = item.lane || 0;
        const n = Math.max(1, item.laneCount || 1);
        const mid = (n - 1) / 2;
        const spread = 40;

        if (item.self) {
          const cy = a.y + a.h / 2 + (lane - mid) * Math.max(spread, 28);
          const x0 = a.x;
          const out = 64 + lane * 18;
          const d = `M ${x0} ${cy} C ${x0 - out} ${cy - 26}, ${x0 - out} ${cy + 26}, ${x0} ${cy + 0.01}`;
          return { d, seatX: x0 - out - 8, seatY: cy, seatSide: "left" };
        }

        // Back-edges into editor: deep under-rail, one lane per source exit
        if (item.to === "editor" && a.x > b.x) {
          const p1 = port(a, "bottom", 0.45);
          const p2 = port(b, "bottom", 0.55);
          const base = Math.max(a.y + a.h, nodes.vibe ? nodes.vibe.y + nodes.vibe.h : b.y + b.h) + 90;
          const railY = base + lane * 28;
          const d = `M ${p1.x} ${p1.y} L ${p1.x} ${railY} L ${p2.x} ${railY} L ${p2.x} ${p2.y}`;
          return { d, seatX: (p1.x + p2.x) / 2, seatY: railY, seatSide: "bottom" };
        }

        // Same column: right vertical bus with wide lane gaps
        if (Math.abs(a.x - b.x) < 4) {
          const right = a.x + a.w + 80 + lane * 32;
          const y1 = a.y + a.h / 2;
          const y2 = b.y + b.h / 2;
          const d = `M ${a.x + a.w} ${y1} L ${right} ${y1} L ${right} ${y2} L ${b.x + b.w} ${y2}`;
          return { d, seatX: right, seatY: (y1 + y2) / 2, seatSide: "right" };
        }

        // Forward: exit → short horizontal pill seat → vertical → into target
        if (b.x > a.x) {
          const yExit = a.y + a.h / 2 + (lane - mid) * spread;
          const yEnter = b.y + b.h / 2;
          const gap = b.x - (a.x + a.w);
          const seatLen = Math.min(160, Math.max(96, gap * 0.38));
          const x1 = a.x + a.w;
          const xSeatEnd = x1 + seatLen;
          const xJoin = a.x + a.w + gap * 0.55 + (lane - mid) * 6;
          const x2 = b.x;
          const d = `M ${x1} ${a.y + a.h / 2} L ${x1 + 10} ${yExit} L ${xSeatEnd} ${yExit} L ${xJoin} ${yExit} L ${xJoin} ${yEnter} L ${x2} ${yEnter}`;
          return {
            d,
            seatX: (x1 + 10 + xSeatEnd) / 2,
            seatY: yExit,
            seatSide: "h",
          };
        }

        // Other leftward: over-rail
        const y1 = a.y + a.h / 2;
        const y2 = b.y + b.h / 2;
        const railY = Math.min(a.y, b.y) - 64 - lane * 24;
        const d = `M ${a.x} ${y1} L ${a.x} ${railY} L ${b.x + b.w} ${railY} L ${b.x + b.w} ${y2}`;
        return { d, seatX: (a.x + b.x + b.w) / 2, seatY: railY, seatSide: "top" };
      }

      function itemIsHot(item) {
        return item.from === selected;
      }

      function itemIsLabeled(item) {
        return item.from === selected;
      }

      function applyCamera() {
        viewport?.setAttribute("transform", `translate(${panX} ${panY}) scale(${scale})`);
      }

      function fitContent() {
        if (!viewport) return;
        const box = viewport.getBBox();
        if (!box.width || !box.height) return;
        const pad = 48;
        const width = svg.clientWidth || 900;
        const height = svg.clientHeight || 700;
        scale = Math.min((width - pad * 2) / box.width, (height - pad * 2) / box.height, 1.2);
        panX = (width - box.width * scale) / 2 - box.x * scale;
        panY = (height - box.height * scale) / 2 - box.y * scale;
        applyCamera();
      }

      function refitSoon() {
        requestAnimationFrame(() => requestAnimationFrame(fitContent));
      }

      function bindClose() {
        hint.querySelector(".close")?.addEventListener("click", () => {
          setSidebarOn(false);
        });
      }

      function updateSidebarButton() {
        const btn = document.getElementById("sidebar");
        if (!btn) return;
        btn.classList.toggle("is-on", sidebarOn);
        btn.setAttribute("aria-pressed", sidebarOn ? "true" : "false");
      }

      function applySidebarVisibility() {
        if (sidebarOn) {
          hint.classList.add("is-open");
          hint.setAttribute("aria-hidden", "false");
        } else {
          hint.classList.remove("is-open");
          hint.setAttribute("aria-hidden", "true");
        }
        updateSidebarButton();
        refitSoon();
      }

      function renderPinnedSidebar() {
        if (!pinnedHint || pinnedHint.type === "state") {
          const stateId = pinnedHint?.id || selected || fsm.initial || "editor";
          if (states[stateId]) {
            renderStateSidebar(stateId, { activate: false });
            return;
          }
        }
        if (pinnedHint.type === "edge" && pinnedHint.item) {
          renderEdgeSidebar(pinnedHint.item, { activate: false });
        } else if (pinnedHint.type === "machine") {
          renderMachineSidebar({ activate: false });
        } else if (selected && states[selected]) {
          renderStateSidebar(selected, { activate: false });
        } else {
          renderMachineSidebar({ activate: false });
        }
      }

      function setSidebarOn(on) {
        sidebarOn = Boolean(on);
        if (sidebarOn && !hint.innerHTML.trim()) renderPinnedSidebar();
        applySidebarVisibility();
        if (sidebarOn) bindClose();
      }

      /** Sync panel visibility to sidebarOn. activate=true turns the toggle on (content actions). */
      function openHint(options = {}) {
        const activate = options.activate !== false;
        bindClose();
        if (activate) {
          sidebarOn = true;
          applySidebarVisibility();
        }
      }

      function hideHint() {
        pinnedHint = null;
        hint.innerHTML = "";
        setSidebarOn(false);
      }

      function renderStateSidebar(stateId, options = {}) {
        const state = states[stateId];
        if (!state) return;
        const steps = effectiveProcedureLines(state);
        const sub = state.substates?.length
          ? `<div class="kv">${state.substates.map((s) => `<span class="chip">${escapeHtml(s)}</span>`).join("")}</div>`
          : "";
        const modeTools = (MODE_TOOLS[stateId] || []).map((n) => toolByName(n)).filter(Boolean);
        const toolHtml = modeTools
          .map(
            (t) =>
              `<h3>Tool · ${escapeHtml(t.name)}</h3><p class="summary">${escapeHtml(t.summary || "")}</p><ul>${[
                ...(t.gate || []).map((g) => `<li><strong>Gate:</strong> ${escapeHtml(g)}</li>`),
                ...(t.mechanics || []).map((g) => `<li>${escapeHtml(g)}</li>`),
              ].join("")}</ul>`,
          )
          .join("");
        hint.innerHTML = `
          <header>
            <div>
              <h2>${escapeHtml(state.label || state.id)}</h2>
              <p>${escapeHtml(state.kind)} · ${escapeHtml(state.permission)} · full instruction body</p>
            </div>
            <button type="button" class="close" aria-label="Close">×</button>
          </header>
          <div class="body">
            <h3>Summary</h3>
            <p class="summary">${escapeHtml(state.summary || "")}</p>
            ${sub ? `<h3>Substates</h3>${sub}` : ""}
            <h3>Instructions (${steps.length})</h3>
            <ul>${steps.map((s) => `<li>${escapeHtml(s)}</li>`).join("") || "<li>(none)</li>"}</ul>
            ${toolHtml}
          </div>
        `;
        openHint({ activate: options.activate !== false });
      }

      function renderEdgeSidebar(item, options = {}) {
        const members = item.members || [];
        const list =
          members.length > 1
            ? `<h3>Bundle members (${members.length})</h3><ul>${members
                .map(
                  (m) =>
                    `<li><strong>${escapeHtml(m.event)}</strong>${
                      m.label && m.label !== m.event ? ` — ${escapeHtml(m.label)}` : ""
                    }<br/><span class="summary">${escapeHtml(m.description || "")}</span></li>`,
                )
                .join("")}</ul>`
            : "";
        const m0 = members[0] || {};
        hint.innerHTML = `
          <header>
            <div>
              <h2>${escapeHtml(item.event)}</h2>
              <p>${escapeHtml(item.from)} → ${escapeHtml(item.to)}${item.userMediated ? " · user-mediated" : ""}</p>
            </div>
            <button type="button" class="close" aria-label="Close">×</button>
          </header>
          <div class="body">
            ${
              item.label
                ? `<h3>DO / label</h3><p class="summary">${escapeHtml(item.label)}</p>`
                : members.length === 1 && m0.label
                  ? `<h3>DO / label</h3><p class="summary">${escapeHtml(m0.label)}</p>`
                  : ""
            }
            <h3>Description</h3>
            <p class="summary">${escapeHtml(item.description || m0.description || "")}</p>
            ${list}
          </div>
        `;
        openHint({ activate: options.activate !== false });
      }

      function renderMachineSidebar(options = {}) {
        const list = (items) =>
          `<ul>${(items || []).map((i) => `<li>${escapeHtml(i)}</li>`).join("") || "<li>(none)</li>"}</ul>`;
        const procHtml = Object.entries(procedures)
          .map(([n, steps]) => `<h3>Procedure · ${escapeHtml(n)}</h3>${list(steps)}`)
          .join("");
        const toolHtml = tools
          .map(
            (t) =>
              `<h3>Tool · ${escapeHtml(t.name)}</h3><p class="summary">${escapeHtml(t.summary || "")}</p>${list(t.gate)}${list(t.mechanics)}`,
          )
          .join("");
        hint.innerHTML = `
          <header>
            <div>
              <h2>${escapeHtml(fsm.title || fsm.id || "Workflow")}</h2>
              <p>v${escapeHtml(fsm.version || "?")} · full instruction set</p>
            </div>
            <button type="button" class="close" aria-label="Close">×</button>
          </header>
          <div class="body">
            <h3>Summary</h3>
            <p class="summary">${escapeHtml(fsm.summary || "")}</p>
            <h3>Session</h3>
            <ul>
              <li>mode := ${escapeHtml(fsm.session?.mode || "")}</li>
              <li>artifact := ${escapeHtml(fsm.session?.artifact || "")}</li>
              <li>scope := ${escapeHtml(fsm.session?.scope || "")}</li>
              <li>review := ${escapeHtml(fsm.session?.review || "")}</li>
            </ul>
            <h3>Ownership</h3>${list(fsm.ownership)}
            <h3>Invariants</h3>${list(fsm.invariants)}
            <h3>Always</h3>${list(fsm.always)}
            <h3>Turn</h3>${list(fsm.turn)}
            ${procHtml}
            ${toolHtml}
            <h3>Notes</h3>${list(fsm.notes)}
          </div>
        `;
        openHint({ activate: options.activate !== false });
      }

      function drawRoundedRect(parent, x, y, w, h, rx, fill, stroke, sw = 1) {
        return svgEl("rect", { x, y, width: w, height: h, rx, fill, stroke, "stroke-width": sw }, parent);
      }

      function truncate(str, max) {
        const s = String(str || "");
        return s.length > max ? `${s.slice(0, max - 1)}…` : s;
      }

      function drawPill(parent, item, route, hot) {
        const hasDo = Boolean(item.label) && !item.bundle;
        const line1 = item.event;
        const line2 = hasDo ? `DO / ${truncate(item.label, 34)}` : null;
        const tw = Math.max(56, Math.min(220, Math.max(line1.length, line2 ? line2.length : 0) * 6.1 + 18));
        const th = line2 ? 30 : 18;
        const x = route.seatX - tw / 2;
        const y = route.seatY - th / 2;
        const g = svgEl("g", { class: "edge-pill" }, parent);
        g.style.cursor = "pointer";
        drawRoundedRect(
          g,
          x,
          y,
          tw,
          th,
          9,
          hot ? "color-mix(in srgb, var(--current) 35%, var(--tool))" : "var(--tool)",
          hot ? "var(--current)" : "var(--child-border)",
          hot ? 1.4 : 1,
        );
        svgEl(
          "text",
          {
            x: route.seatX,
            y: line2 ? y + 12 : y + 13,
            fill: "var(--text)",
            "font-size": 9,
            "font-weight": 700,
            "text-anchor": "middle",
          },
          g,
        ).textContent = truncate(line1, 36);
        if (line2) {
          svgEl(
            "text",
            {
              x: route.seatX,
              y: y + 24,
              fill: "var(--muted)",
              "font-size": 8,
              "text-anchor": "middle",
            },
            g,
          ).textContent = line2;
        }
        g.addEventListener("click", (e) => {
          e.stopPropagation();
          selected = item.from;
          pinnedHint = { type: "edge", id: item.id, item };
          if (sidebarOn) renderEdgeSidebar(item, { activate: false });
          render({ preserveCamera: true });
        });
      }

      function render(options = {}) {
        const preserveCamera = Boolean(options.preserveCamera);
        svg.replaceChildren();
        const defs = svgEl("defs", {}, svg);
        for (const [id, fill] of [
          ["arrow", "var(--edge-hot)"],
          ["arrow-dim", "var(--edge)"],
        ]) {
          const marker = svgEl(
            "marker",
            {
              id,
              viewBox: "0 0 10 10",
              refX: "9",
              refY: "5",
              markerWidth: "6",
              markerHeight: "6",
              orient: "auto",
            },
            defs,
          );
          svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill }, marker);
        }

        viewport = svgEl("g", { id: "viewport" }, svg);
        const { nodes, frame } = layoutFlatXState();
        const items = assignLanes(collapseEdges(), nodes);

        // Machine frame
        drawRoundedRect(
          viewport,
          frame.x,
          frame.y,
          frame.w,
          frame.h,
          14,
          "color-mix(in srgb, var(--card) 40%, transparent)",
          "var(--current)",
          1.6,
        );
        drawRoundedRect(viewport, frame.x, frame.y, frame.w, frame.head, 14, "var(--card-head)", "none");
        svgEl(
          "rect",
          {
            x: frame.x,
            y: frame.y + frame.head - 14,
            width: frame.w,
            height: 14,
            fill: "var(--card-head)",
          },
          viewport,
        );
        const title = svgEl(
          "text",
          {
            x: frame.x + 16,
            y: frame.y + 28,
            fill: "var(--text)",
            "font-size": 14,
            "font-weight": 700,
          },
          viewport,
        );
        title.textContent = fsm.id || "piDirectorWorkflow";

        const edgeLayer = svgEl("g", { id: "edges" }, viewport);
        const nodeLayer = svgEl("g", { id: "nodes" }, viewport);
        const pillLayer = svgEl("g", { id: "pills" }, viewport);

        // Edges
        for (const item of items) {
          const route = routeItem(item, nodes);
          if (!route) continue;
          item._route = route;
          const hot = itemIsHot(item);
          const pathAttrs = {
            d: route.d,
            fill: "none",
            stroke: hot ? "var(--edge-hot)" : "var(--edge)",
            "stroke-width": hot ? 1.85 : item.bundle ? 1.15 : 1.05,
            opacity: hot ? 0.95 : 0.22,
            "marker-end": hot ? "url(#arrow)" : "url(#arrow-dim)",
          };
          if (item.bundle) pathAttrs["stroke-dasharray"] = "5 3";
          svgEl("path", pathAttrs, edgeLayer);
        }

        // Nodes
        for (const node of Object.values(nodes)) {
          const g = svgEl("g", { class: "state-node", "data-id": node.id }, nodeLayer);
          const isSel = node.id === selected;
          const isFinal = node.id === "handoff";
          const fill =
            node.kind === "procedure" ? "var(--proc)" : node.id === "editor" ? "var(--child)" : "var(--card)";

          if (isSel) {
            drawRoundedRect(
              g,
              node.x - 5,
              node.y - 5,
              node.w + 10,
              node.h + 10,
              12,
              "var(--current-glow)",
              "var(--current)",
              1.4,
            );
          }

          if (isFinal) {
            drawRoundedRect(
              g,
              node.x - 3,
              node.y - 3,
              node.w + 6,
              node.h + 6,
              11,
              "none",
              isSel ? "var(--current)" : "var(--card-border)",
              1.2,
            );
          }

          drawRoundedRect(
            g,
            node.x,
            node.y,
            node.w,
            node.h,
            10,
            fill,
            isSel ? "var(--current)" : "var(--card-border)",
            isSel ? 2 : 1.2,
          );

          if (isFinal) {
            // small final marker square
            drawRoundedRect(g, node.x + 10, node.y + node.h / 2 - 6, 12, 12, 2, "none", "var(--muted)", 1.2);
            drawRoundedRect(g, node.x + 13, node.y + node.h / 2 - 3, 6, 6, 1, "var(--muted)", "none", 0);
          }

          svgEl(
            "text",
            {
              x: node.x + node.w / 2 + (isFinal ? 6 : 0),
              y: node.y + node.h / 2 + 4,
              fill: "var(--text)",
              "font-size": 13,
              "font-weight": 700,
              "text-anchor": "middle",
            },
            g,
          ).textContent = node.label;

          g.addEventListener("click", (e) => {
            e.stopPropagation();
            selected = node.id;
            pinnedHint = { type: "state", id: node.id };
            if (sidebarOn) renderStateSidebar(node.id, { activate: false });
            render({ preserveCamera: true });
          });
        }

        // Initial marker → editor
        const ed = nodes.editor;
        if (ed) {
          const cy = ed.y + ed.h / 2;
          const cx = ed.x - 28;
          svgEl("circle", { cx: cx - 10, cy, r: 5.5, fill: "var(--text)" }, viewport);
          svgEl(
            "path",
            {
              d: `M ${cx - 4} ${cy} L ${ed.x} ${cy}`,
              stroke: "var(--text)",
              "stroke-width": 1.6,
              fill: "none",
              "marker-end": "url(#arrow)",
            },
            viewport,
          );
        }

        // Pills on top
        for (const item of items) {
          if (!item._route || !itemIsLabeled(item)) continue;
          drawPill(pillLayer, item, item._route, itemIsHot(item));
        }

        if (preserveCamera) applyCamera();
        else requestAnimationFrame(fitContent);
      }

      document.getElementById("zoom-in").onclick = () => {
        scale = Math.min(scale * 1.2, 3.5);
        applyCamera();
      };
      document.getElementById("zoom-out").onclick = () => {
        scale = Math.max(scale / 1.2, 0.2);
        applyCamera();
      };
      document.getElementById("fit").onclick = () => fitContent();
      document.getElementById("reset").onclick = () => {
        selected = fsm.initial || "editor";
        pinnedHint = null;
        if (sidebarOn) renderPinnedSidebar();
        render();
      };
      document.getElementById("sidebar").onclick = () => {
        if (sidebarOn) {
          setSidebarOn(false);
          return;
        }
        setSidebarOn(true);
        renderPinnedSidebar();
        applySidebarVisibility();
      };

      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      svg.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".state-node") || e.target.closest(".edge-pill")) return;
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        svg.classList.add("is-panning");
        svg.setPointerCapture(e.pointerId);
      });
      svg.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        panX += e.clientX - lastX;
        panY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        applyCamera();
      });
      svg.addEventListener("pointerup", () => {
        dragging = false;
        svg.classList.remove("is-panning");
      });
      svg.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
          const next = Math.min(3.5, Math.max(0.2, scale * factor));
          const rect = svg.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          panX = cx - ((cx - panX) * next) / scale;
          panY = cy - ((cy - panY) * next) / scale;
          scale = next;
          applyCamera();
        },
        { passive: false },
      );

      hint.setAttribute("aria-hidden", "true");
      updateSidebarButton();
      if (states[selected]) render();
    </script>
  </body>
</html>
