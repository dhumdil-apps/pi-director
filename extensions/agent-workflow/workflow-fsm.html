<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Director Agent Workflow · FSM Visualizer</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./workflow-fsm.css" />
    <script src="./tuto-ui.iife.js"></script>
    <script src="./workflow-layout.js"></script>
    <script src="./workflow-fsm.data.js"></script>
  </head>
  <body>
    <header id="topbar">
      <div class="topbar-brand">
        <span class="brand-logo" aria-hidden="true">π</span>
        <span class="brand-name">Pi Director</span>
        <span class="brand-badge-tag">Workflow FSM</span>
      </div>

      <div class="topbar-actions">
        <div class="install-bar" title="Install Pi Director command">
          <span class="prompt" aria-hidden="true">$</span>
          <code class="cmd-text" id="cmd-install">pi install https://github.com/dhumdil-apps/pi-director</code>
          <button
            type="button"
            class="btn-copy"
            id="btn-copy-cmd"
            title="Copy install command"
            aria-label="Copy install command"
          >
            <svg
              class="icon-copy"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg
              class="icon-check"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>

        <button type="button" id="btn-theme" class="btn-icon" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <tuto-flow-canvas id="flow-canvas"></tuto-flow-canvas>
    </main>

    <footer id="bottombar">
      <div class="footer-left">
        <a
          href="https://github.com/dhumdil-apps/pi-director"
          target="_blank"
          rel="noreferrer"
          class="gh-version-badge"
          title="Pi Director on GitHub"
          aria-label="Pi Director on GitHub"
        >
          <svg
            viewBox="0 0 24 24"
            width="13"
            height="13"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            ></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
          <span class="version-tag" id="footer-version">v2.2.0</span>
        </a>
      </div>

      <div class="footer-right">
        <span class="kbd-hint"><kbd>Wheel</kbd> Zoom</span>
        <span class="kbd-hint"><kbd>Drag</kbd> Pan</span>
        <span class="kbd-hint"><kbd>M</kbd> Move Mode</span>
        <span class="kbd-hint"><kbd>E</kbd> Edit Mode</span>
        <span class="kbd-hint"><kbd>S</kbd> Snapshot</span>
        <span class="kbd-hint"><kbd>F</kbd> Fit</span>
        <span class="kbd-hint"><kbd>I</kbd> Inspector</span>
        <span class="kbd-hint"><kbd>Esc</kbd> Normal</span>
      </div>
    </footer>

    <script src="./workflow-visualizer.js"></script>
  </body>
</html>
